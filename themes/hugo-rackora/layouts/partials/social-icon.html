{{- $icon := .icon | default .name | lower -}}
{{- if eq $icon "github" -}}
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
{{- else if or (eq $icon "zhihu") (eq $icon "知乎") -}}
  <span class="profile-link-word" aria-hidden="true">知</span>
{{- else if or (eq $icon "bilibili") (eq $icon "哔哩哔哩") -}}
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 3 2 4m6-4-2 4"/><rect x="3" y="7" width="18" height="14" rx="4"/><path d="M8.5 13.5v1m7-1v1M9 18c2 1 4 1 6 0"/></svg>
{{- else if eq $icon "email" -}}
  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
{{- else if eq $icon "rss" -}}
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="19" r="1"/><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/></svg>
{{- else -}}
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
{{- end -}}
