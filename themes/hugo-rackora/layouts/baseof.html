<!doctype html>
<html lang="{{ site.Language.Locale | default "zh-CN" }}" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f4">
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description | default site.Title }}{{ end }}">
  <title>{{ if .IsHome }}{{ site.Title }} · 独立博客{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <link rel="canonical" href="{{ .Permalink }}">
  <script>try{if(localStorage.getItem('rackora-static-theme')==='dark'){document.documentElement.dataset.theme='dark';document.documentElement.classList.add('dark')}}catch(_){}</script>
  <link rel="stylesheet" href="{{ "css/syntax.css" | relURL }}">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  <link rel="icon" href="{{ "favicon.svg" | relURL }}?v=w-1" type="image/svg+xml">
  <script src="{{ "js/site.js" | relURL }}" defer></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="icon-sprite" aria-hidden="true"><symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.3 15.9A8.5 8.5 0 0 1 8.1 3.7 8.5 8.5 0 1 0 20.3 15.9Z"/></symbol><symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.1M4 12h.1M4 18h.1"/></symbol><symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol></svg>
  <a class="skip" href="#main">跳到正文</a>
  <header class="site-header"><div class="shell header-inner">
    <a class="brand" href="{{ "" | relURL }}" aria-label="返回首页"><img class="brand-mark" src="{{ partial "avatar-url.html" . }}" alt="" width="39" height="39"><strong>{{ site.Title }}</strong></a>
    <nav class="nav" id="main-nav" aria-label="主导航">
      <a href="{{ "" | relURL }}"{{ if .IsHome }} aria-current="page"{{ end }}>首页</a>
      <a href="{{ "categories/" | relURL }}"{{ if eq .Data.Plural "categories" }} aria-current="page"{{ end }}>分类</a>
      <a href="{{ "tags/" | relURL }}"{{ if eq .Data.Plural "tags" }} aria-current="page"{{ end }}>标签</a>
      <a href="{{ "archives/" | relURL }}"{{ if eq .Section "archives" }} aria-current="page"{{ end }}>归档</a>
      <a href="{{ "about/" | relURL }}"{{ if eq .Section "about" }} aria-current="page"{{ end }}>关于</a>
    </nav>
    <button class="icon-button menu-button" id="menu-button" aria-controls="main-nav" aria-expanded="false" aria-label="打开导航"><svg><use href="#i-menu"/></svg></button>
    <div class="header-actions"><button class="icon-button" id="search-button" aria-label="搜索文章" title="搜索文章"><svg><use href="#i-search"/></svg></button><button class="icon-button" id="theme-button" aria-label="切换深浅色" title="切换深浅色"><svg><use href="#i-moon"/></svg></button></div>
  </div></header>
  <div class="reading-progress" id="reading-progress" hidden><span></span></div>
  <main class="site-main" id="main" tabindex="-1">{{ block "main" . }}{{ end }}</main>
  <footer class="site-footer"><div class="shell footer-inner"><strong>{{ site.Title }}</strong><p>© {{ now.Year }} · {{ site.Params.tagline | default "清晰表达，长期可读" }}</p></div></footer>
  <dialog class="search-dialog" id="search-dialog" data-index-url="{{ "index.json" | relURL }}" aria-label="搜索文章"><div class="dialog-top"><svg><use href="#i-search"/></svg><input id="search-input" type="search" placeholder="搜索文章标题或内容…" autocomplete="off" aria-label="搜索关键词"><button id="search-close" aria-label="关闭搜索">×</button></div><div class="search-results" id="search-results"><p>输入关键词开始搜索。</p></div></dialog>
  {{ partial "features/katex.html" . }}
  {{ partial "features/mermaid.html" . }}
</body>
</html>
