  <script>
    /* ===== 只需编辑这一段，就能更换站名和文章。文章正文可使用 HTML。 ===== */
    const SITE = {
      title: "lantian",
      subtitle: "记录技术、生活与途中所见。",
      intro: "清晰表达，长期可读",
      about: "这里是 lantian 的独立空间。我把学到的技术、走过的路和日常思考整理成文章，留给未来的自己，也分享给偶然路过的人。"
    };
    const POSTS = [
      {
        slug: "git-study", title: "git学习", date: "2026-10-29", category: "技术", tags: ["Git", "学习笔记"],
        excerpt: "从工作区、暂存区到提交历史，整理常用 Git 命令与日常工作流程。",
        content: `<p>Git 帮我们记录文件的变化，也让多个版本可以被清楚地追踪。这篇示例文章演示静态站点的文章排版。</p>
          <h2>三个工作区域</h2><p>工作区是正在编辑的文件；暂存区保存准备提交的修改；提交历史则记录已经确认的版本。</p>
          <blockquote><p>先确认改动，再暂存，最后提交。这样每次提交都更容易理解。</p></blockquote>
          <h2>常用命令</h2><p>修改文件后，可以先查看状态，再将需要的文件加入暂存区。</p>
          <pre><code>git status\ngit add 文件名\ngit commit -m "记录本次修改"</code></pre>
          <h3>查看提交记录</h3><p>使用 <code>git log --oneline</code> 可以快速回顾之前的提交。实际写文章时，替换这里的示例正文即可。</p>`
      },
      {
        slug: "brushless-motor", title: "无刷电机", date: "2026-10-29", category: "技术", tags: ["硬件", "笔记"],
        excerpt: "从结构和工作原理出发，梳理无刷电机的基础概念。",
        content: `<p>无刷电机通过电子换向控制电流方向，省去了传统有刷电机中的机械电刷。</p><h2>基本结构</h2><p>常见结构包含定子、转子和控制电路。理解它们各自的作用，是继续学习驱动方式的基础。</p><h2>学习记录</h2><p>这里是示例内容。你可以直接在文件中写入自己的文章、插入图片或添加更多小节。</p>`
      },
      {
        slug: "a-quiet-day", title: "把日子慢慢写下来", date: "2026-10-21", category: "随笔", tags: ["生活"],
        excerpt: "留一点时间记录日常的小事，让平凡的瞬间也有迹可循。",
        content: `<p>有些日子没有特别的大事，但仍然值得记住。写下来，是给生活留一个安静的角落。</p><h2>关于记录</h2><p>不必每次都写得完整，只要真实地留下当时的想法，日后再读也会有新的感受。</p>`
      },
      {
        slug: "about-writing", title: "为什么开始写博客", date: "2026-10-14", category: "感悟", tags: ["写作"],
        excerpt: "用一个简单的网站，持续保存想法、经验和问题。",
        content: `<p>一个独立博客像自己的书架。文章可以慢慢写，分类可以慢慢整理，不必着急。</p><h2>从第一篇开始</h2><p>把想记录的内容放到这里，发布到 GitHub Pages，就拥有了自己的静态网站。</p>`
      }
    ];
    /* ===== 内容配置到这里结束。新增文章时复制上面一项并修改 slug。 ===== */

    const $ = (selector,root=document) => root.querySelector(selector);
    const esc = value => String(value ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    const dateText = value => {const [y,m,d]=value.split("-");return `${y}年${Number(m)}月${Number(d)}日`};
    const categories = () => [...new Set(POSTS.map(p=>p.category))];
    const categoryCount = name => POSTS.filter(p=>p.category===name).length;
    const card = p => `<li class="post-card"><div class="card-eyebrow"><a href="#/category/${encodeURIComponent(p.category)}">${esc(p.category)}</a><time datetime="${esc(p.date)}">${esc(p.date)}</time></div><h3><a href="#/post/${encodeURIComponent(p.slug)}">${esc(p.title)}</a></h3><p>${esc(p.excerpt)}</p><div class="card-meta"><span>${esc(p.tags.join(" · "))}</span></div></li>`;
    const sidebar = () => `<aside class="home-aside" aria-label="站点信息"><section class="panel"><div class="profile-top"><span class="profile-mark" aria-hidden="true">R</span><div><h2>${esc(SITE.title)}</h2><p>${esc(SITE.subtitle)}</p></div></div><div class="profile-stats"><div><small>文章</small><strong>${POSTS.length}</strong></div><div><small>分类</small><strong>${categories().length}</strong></div></div></section><section class="panel"><div class="panel-head"><h2>分类</h2><a href="#/categories">全部</a></div><ul class="category-list">${categories().map(c=>`<li><a href="#/category/${encodeURIComponent(c)}"><span>${esc(c)}</span><small>${categoryCount(c)}</small></a></li>`).join("")}</ul></section><section class="panel"><div class="panel-head"><h2>标签</h2></div><div class="tag-list">${[...new Set(POSTS.flatMap(p=>p.tags))].map(t=>`<a href="#/tag/${encodeURIComponent(t)}">${esc(t)}</a>`).join("")}</div></section></aside>`;
    const home = () => `<div class="shell home-layout"><section class="home-heading"><p class="eyebrow">独立出版</p><h1>${esc(SITE.title)}</h1><p class="subtitle">${esc(SITE.subtitle)}</p><div class="home-meta"><span>${POSTS.length} 篇内容</span><span>${esc(SITE.intro)}</span></div></section><section class="home-content"><div class="section-title"><h2>最新文章</h2><a href="#/archive">查看归档 →</a></div><ul class="post-list">${[...POSTS].sort((a,b)=>b.date.localeCompare(a.date)).map(card).join("")}</ul></section>${sidebar()}</div>`;
    const pageHeading = (eyebrow,title,description) => `<header class="page-heading"><p class="eyebrow">${esc(eyebrow)}</p><h1>${esc(title)}</h1><p>${esc(description)}</p></header>`;
    const archive = () => {const sorted=[...POSTS].sort((a,b)=>b.date.localeCompare(a.date));const years=[...new Set(sorted.map(p=>p.date.slice(0,4)))];return `<div class="shell page-wrap content-narrow">${pageHeading("时间索引","文章归档",`${POSTS.length} 篇文章，按发布时间整理。`)}<div class="archive-list">${years.map(y=>`<h2 class="archive-year">${y}</h2>${sorted.filter(p=>p.date.startsWith(y)).map(p=>`<div class="archive-row"><time datetime="${esc(p.date)}">${esc(p.date.slice(5))}</time><a href="#/post/${encodeURIComponent(p.slug)}">${esc(p.title)}</a><small>${esc(p.category)}</small></div>`).join("")}`).join("")}</div></div>`};
    const categoryPage = (category,tag=false) => {const selected=tag?POSTS.filter(p=>p.tags.includes(category)):POSTS.filter(p=>p.category===category);return `<div class="shell page-wrap content-narrow">${pageHeading(tag?"标签":"文章分类",category,`${selected.length} 篇文章`)}<ul class="post-list">${selected.length?selected.map(card).join(""):`<li class="about-card">这个分类暂时没有文章。</li>`}</ul></div>`};
    const categoriesPage = () => `<div class="shell page-wrap content-narrow">${pageHeading("内容索引","分类",`${categories().length} 个分类`)}<div class="archive-list">${categories().map(c=>`<div class="archive-row"><a href="#/category/${encodeURIComponent(c)}">${esc(c)}</a><small>${categoryCount(c)} 篇文章</small></div>`).join("")}</div></div>`;
    const about = () => `<div class="shell page-wrap content-narrow">${pageHeading("关于本站","关于",SITE.subtitle)}<article class="about-card"><h2>你好，我是 ${esc(SITE.title)}</h2><p>${esc(SITE.about)}</p><p>这个页面是单文件静态博客示例。网站内容写在 <code>index.html</code> 底部的 <code>SITE</code> 和 <code>POSTS</code> 中，发布到 GitHub Pages 后即可公开访问。</p></article></div>`;
    function postPage(p){
      const body=document.createElement("div");body.innerHTML=p.content;
      const headings=[...body.querySelectorAll("h2,h3")];headings.forEach((h,i)=>h.id=`section-${i+1}`);
      const toc=headings.map(h=>`<a href="#${h.id}" data-level="${h.tagName.slice(1)}">${esc(h.textContent)}</a>`).join("");
      const tags=p.tags.map(t=>`<a href="#/tag/${encodeURIComponent(t)}">${esc(t)}</a>`).join("");
      return `<div class="article-hero"><a class="back-link" href="#/">← 返回首页</a><h1>${esc(p.title)}</h1><div class="article-hero-meta"><time datetime="${esc(p.date)}">${dateText(p.date)}</time><span>${esc(p.category)}</span><span>${Math.max(1,Math.ceil(body.textContent.replace(/\s/g,"").length/500))} 分钟阅读</span></div></div><div class="article-stage"><article class="article-paper"><div class="article-body" id="article-body">${body.innerHTML}</div><div class="post-end"><div class="post-tags">${tags}</div><a class="back" href="#/archive">全部文章 →</a></div></article>${headings.length?`<aside class="toc-position"><nav class="toc" aria-label="文章目录"><h2>目录</h2>${toc}</nav></aside>`:""}</div>`;
    }
    const main=$("#main"), searchDialog=$("#search-dialog"), tocDialog=$("#toc-dialog"), tocButton=$("#toc-button"), progress=$("#reading-progress");
    function currentRoute(){return (location.hash||"#/").replace(/^#\//,"").split("/")}
    function render(){
      const [route,raw]=currentRoute(),arg=decodeURIComponent(raw||"");let html,nav="",post=null;
      if(route==="post"){post=POSTS.find(p=>p.slug===arg);html=post?postPage(post):`<div class="shell page-wrap">${pageHeading("未找到","文章不存在","请返回首页查看其他文章。")}</div>`}
      else if(route==="archive"){html=archive();nav="archive"}
      else if(route==="categories"){html=categoriesPage();nav="categories"}
      else if(route==="category"){html=categoryPage(arg);nav="categories"}
      else if(route==="tag"){html=categoryPage(arg,true)}
      else if(route==="about"){html=about();nav="about"}
      else{html=home();nav="home"}
      main.innerHTML=html;
      document.title=route ? `${post?post.title:route==="archive"?"归档":route==="categories"?"分类":route==="about"?"关于":arg||SITE.title} · ${SITE.title}` : `${SITE.title} · 独立博客`;
      document.querySelectorAll("[data-nav]").forEach(a=>a.setAttribute("aria-current",a.dataset.nav===nav?"page":"false"));
      tocButton.hidden=!post||!$(".toc-position");progress.hidden=!post;
      $("#main-nav").classList.remove("open");$("#menu-button").setAttribute("aria-expanded","false");
      if(tocDialog.open)tocDialog.close();
      if(post){$("#toc-results").innerHTML=[...document.querySelectorAll(".toc a")].map(a=>`<a href="${a.getAttribute("href")}">${esc(a.textContent)}</a>`).join("");updateProgress()}
      else progress.querySelector("span").style.width="0";
      window.scrollTo({top:0,behavior:"instant"});
    }
    function updateProgress(){if(progress.hidden)return;const page=document.documentElement;const total=page.scrollHeight-page.clientHeight;progress.querySelector("span").style.width=`${total>0?Math.max(0,Math.min(100,window.scrollY/total*100)):100}%`;
      const links=[...document.querySelectorAll(".toc a")];let active="";for(const link of links){const heading=$(link.getAttribute("href"));if(heading&&heading.getBoundingClientRect().top<=130)active=link.getAttribute("href")};links.forEach(link=>link.classList.toggle("active",link.getAttribute("href")===active));
    }
    function showSearch(query=""){$("#search-input").value=query;showResults();searchDialog.showModal();$("#search-input").focus()}
    function showResults(){const q=$("#search-input").value.trim().toLowerCase();const found=q?POSTS.filter(p=>[p.title,p.excerpt,p.category,...p.tags].join(" ").toLowerCase().includes(q)):POSTS;$("#search-results").innerHTML=found.length?found.map(p=>`<a href="#/post/${encodeURIComponent(p.slug)}">${esc(p.title)}<small>${esc(p.category)} · ${esc(p.date)}</small></a>`).join(""):`<p>没有找到相关内容。</p>`}
    $("#search-button").addEventListener("click",()=>showSearch());$("#search-close").addEventListener("click",()=>searchDialog.close());$("#search-input").addEventListener("input",showResults);$("#search-results").addEventListener("click",e=>{if(e.target.closest("a"))searchDialog.close()});
    $("#toc-button").addEventListener("click",()=>tocDialog.showModal());$("#toc-close").addEventListener("click",()=>tocDialog.close());$("#toc-results").addEventListener("click",e=>{if(e.target.closest("a"))tocDialog.close()});
    $("#menu-button").addEventListener("click",()=>{const open=$("#main-nav").classList.toggle("open");$("#menu-button").setAttribute("aria-expanded",String(open))});
    const saved=localStorage.getItem("rackora-static-theme");if(saved==="dark")document.documentElement.dataset.theme="dark";
    function themeIcon(){$("#theme-button use").setAttribute("href",document.documentElement.dataset.theme==="dark"?"#i-sun":"#i-moon")};themeIcon();
    $("#theme-button").addEventListener("click",()=>{const next=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=next;localStorage.setItem("rackora-static-theme",next);themeIcon()});
    document.querySelectorAll("[data-site-title]").forEach(e=>e.textContent=SITE.title);$("#year").textContent=new Date().getFullYear();
    window.addEventListener("hashchange",()=>{if(/^#section-/.test(location.hash))return;render()});window.addEventListener("scroll",updateProgress,{passive:true});window.addEventListener("resize",updateProgress);
    document.addEventListener("click",e=>{const link=e.target.closest("a[href^='#section-']");if(link){e.preventDefault();$(link.getAttribute("href"))?.scrollIntoView({behavior:"smooth"})}});
    render();
  </script>
</body>
</html>
